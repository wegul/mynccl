    pf1_current: "ns1pf1"
    pf0_target: "ns1pf0"
    pf1_target: "ns1pf1"
    pf0_match:
      id_path: "pci-0000:d6:00.0"
      mac: "e8:9e:49:7e:83:0e"
    pf1_match:
