# Bare-metal GPU<->NIC source-of-truth mapping for syrax49
# Derived from preflight discovery (nvidia-smi topo, sysfs PCI mapping, rdma link).
# This file is consumed by:
# - gpu_nic_discovery (consistency checks)
# - gpu_nic_prepare (.link + namespace preparation)

baremetal_namespace_range:
  start: 1
  end: 4

