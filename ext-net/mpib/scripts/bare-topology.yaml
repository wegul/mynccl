fabrics:
  pf0:
    cidrs:
      island_a: 10.0.1.0/24
      island_b: 10.0.2.0/24
    gateways:
      island_a: 10.0.1.199
      island_b: 10.0.2.199
    connectivity: cross-island-enabled

  pf1:
    cidrs:
      island_a: 10.9.1.0/24
      island_b: 10.9.2.0/24
    gateways:
      island_a: 10.9.1.199
      island_b: 10.9.2.199
    connectivity: same-island-only

# Validation contract used by bringup scripts
validation:
  ip_suffix_matches_namespace_id: true
  rdma_device_name_source: runtime-resolve-from-netdev
  rdma_topology_source: pci-address
  control_plane_port_mapping_source: mac-address

fat_tree_2tor_1spine:
  fixed_ports:
    tor_a_uplink: {front_panel: "25/0", dev_port: 56}
    spine_from_tor_a: {front_panel: "26/0", dev_port: 64}
    tor_b_uplink: {front_panel: "27/0", dev_port: 40}
    spine_from_tor_b: {front_panel: "28/0", dev_port: 48}
  gateways:
    tor_a_pf0: 10.0.1.199
    tor_b_pf0: 10.0.2.199

fat_tree_2tor_2spine:
  fixed_ports:
    tor_a_uplink1:      {front_panel: "25/0", dev_port: 56}
    spine_a_from_tor_a: {front_panel: "26/0", dev_port: 64}
    tor_b_uplink1:      {front_panel: "27/0", dev_port: 40}
    spine_a_from_tor_b: {front_panel: "28/0", dev_port: 48}
    tor_a_uplink2:      {front_panel: "29/0", dev_port: 24}
    spine_b_from_tor_a: {front_panel: "30/0", dev_port: 32}
    tor_b_uplink2:      {front_panel: "31/0", dev_port: 8}
    spine_b_from_tor_b: {front_panel: "32/0", dev_port: 16}
  vrfs:
    tor_a: 101
    spine_a: 102
    tor_b: 103
    spine_b: 104
  gateways:
    tor_a_pf0: 10.0.1.199
    tor_b_pf0: 10.0.2.199
  ecmp_groups:
    tor_a_to_remote:
      members: [tor_a_uplink1, tor_a_uplink2]
      prefix: 10.0.2.0/24
    tor_b_to_remote:
      members: [tor_b_uplink1, tor_b_uplink2]
      prefix: 10.0.1.0/24

router_programming:
  cross_island_pairs:
    - ns1: [ns5, ns6, ns7, ns8]
    - ns2: [ns5, ns6, ns7, ns8]
    - ns3: [ns5, ns6, ns7, ns8]
    - ns4: [ns5, ns6, ns7, ns8]
