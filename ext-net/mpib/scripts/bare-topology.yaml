cluster:
  name: baremetal
  management:
    local_controller: macbook
    ssh_config: /Users/suweigao/.ssh/config
    hosts:
      - syrax49
      - taco

  islands:
    island_a:
      host: syrax49
      namespaces: [ns1, ns2, ns3, ns4]
    island_b:
      host: taco
      namespaces: [ns5, ns6, ns7, ns8]

  # Source of truth: PCI address + namespace contract.
  # NOTE: Do not treat mlx5_X as stable across reboot.
  # Runtime should resolve RDMA device names from namespace netdev.
  namespaces:
    ns1:
      host: syrax49
      island: a
      group_id: 1
      gpu:
        index: 1
        pci: "0000:d8:00.0"
        numa_node: 0
        cpu_set: "0-15,64-79"
      pfs:
        pf0:
          netdev: ns1pf0
          pci: "0000:d6:00.0"
          mac: "e8:9e:49:7e:83:0e"
          ip: 10.0.1.1/24
        pf1:
          netdev: ns1pf1
          pci: "0000:d6:00.1"
          mac: "e8:9e:49:7e:83:0f"
          ip: 10.9.1.1/24

    ns2:
